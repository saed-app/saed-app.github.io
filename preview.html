<!doctype html>
<!-- صفحة معاينة أثناء التطوير فقط: تعرض الجوال واللابتوب معاً، ولا تدخل في النسخة المنشورة -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>معاينة ساعد</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px 16px 16px;
        background: #26262a;
        color: #f2f2f4;
        font-family: system-ui, sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      button {
        min-height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: #d8dadd;
        color: #0a0a0b;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      main {
        display: flex;
        flex: 1;
        gap: 24px;
        min-height: 0;
      }

      section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      #laptop-section {
        flex: 1;
      }

      .label {
        font-size: 14px;
        font-weight: 700;
      }

      .label a {
        margin-inline-start: 8px;
        color: #d8dadd;
        font-weight: 400;
      }

      .stage {
        flex: 1;
        width: 100%;
        min-height: 0;
        position: relative;
      }

      .frame {
        position: absolute;
        top: 0;
        left: 50%;
        overflow: hidden;
        border: 0;
        border-radius: 14px;
        background: #ffffff;
        transform-origin: top left;
      }

      #phone-section {
        flex: none;
        width: 340px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>معاينة ساعد</h1>
      <a href="/preview-tools.html" style="color: #d8dadd">الأيقونات والألوان</a>
      <button type="button" id="reload">تحديث الشاشتين</button>
    </header>
    <main>
      <section id="phone-section">
        <div class="label">الجوال<a href="/" target="_blank">افتحه وحده</a></div>
        <div class="stage"><iframe class="frame" title="الجوال" src="/" data-width="390" data-height="844"></iframe></div>
      </section>
      <section id="laptop-section">
        <div class="label">اللابتوب<a href="/" target="_blank">افتحه وحده</a></div>
        <div class="stage"><iframe class="frame" title="اللابتوب" src="/" data-width="1440" data-height="900"></iframe></div>
      </section>
    </main>
    <script>
      const frames = [...document.querySelectorAll('.frame')]

      // كل إطار يعرض التطبيق بمقاسه الحقيقي، ثم يُصغَّر ليتسع في الصفحة
      function fit() {
        for (const frame of frames) {
          const width = Number(frame.dataset.width)
          const height = Number(frame.dataset.height)
          const stage = frame.parentElement
          const scale = Math.min(stage.clientWidth / width, stage.clientHeight / height, 1)
          frame.style.width = `${width}px`
          frame.style.height = `${height}px`
          frame.style.transform = `scale(${scale}) translateX(-50%)`
        }
      }

      window.addEventListener('resize', fit)
      fit()

      document.getElementById('reload').addEventListener('click', () => {
        for (const frame of frames) frame.contentWindow.location.reload()
      })
    </script>
  </body>
</html>
